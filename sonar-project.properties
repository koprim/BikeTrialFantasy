sonar.projectKey=biketrial-fantasy
sonar.projectName=Super Fantasy Bike Trial
sonar.sourceEncoding=UTF-8

# Production code: the app, the shared backend, build scripts, SQL migrations and Edge Function entry points.
sonar.sources=src,scripts,supabase/migrations,supabase/functions,App.js
sonar.tests=src,scripts,test
sonar.test.inclusions=**/*.test.js,test/**/*.js
sonar.exclusions=**/node_modules/**,**/*.test.js,supabase/functions/_shared/backend.mjs,coverage/**

# Unit-test coverage produced by `npm run sonar` (jest --coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Developer tools (seed generator, Sonar and env wrappers) never ship to players: still analysed for
# bugs and vulnerabilities, but left out of the coverage measure.
sonar.coverage.exclusions=scripts/**
