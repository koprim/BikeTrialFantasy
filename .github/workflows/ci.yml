name: CI
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx jest --ci

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Edge Functions import the generated, gitignored _shared/backend.mjs, and `supabase start`
      # reads their imports while starting the edge runtime: build the bundle first.
      - run: npm run build:edge
      # Skip services no test needs (no mail, dashboard, image proxy or log shipping).
      - run: npx supabase start -x studio,imgproxy,mailpit,postgres-meta,vector
      - run: npm run test:int
      - run: cp supabase/functions/.env.example supabase/functions/.env
      - name: Serve Edge Functions
        run: nohup npx supabase functions serve --env-file supabase/functions/.env > functions-serve.log 2>&1 &
      - name: Wait for Edge Functions
        run: |
          # Without a token the gateway answers 401 before routing, so call with the anon key:
          # our authenticator then answers 401, while an unserved function gives a 5xx (or no answer).
          ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ANON_KEY" \
              http://127.0.0.1:54321/functions/v1/open-daily-pack || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then exit 0; fi
            sleep 1
          done
          echo 'Edge Functions did not start within 60s' && cat functions-serve.log
          exit 1
      - run: npm run test:functions
